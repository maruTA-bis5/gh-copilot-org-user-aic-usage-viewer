name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn verify --batch-mode

      - name: Upload bootable JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bootable-jar
          path: target/gh-copilot-org-user-aic-usage-viewer-bootable.jar
          retention-days: 7
          if-no-files-found: error
